<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Vossie Marketplace</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vossie" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      /* Phone browsers: use the visible height (dvh) so the bottom bar is not hidden under the
         browser toolbar; stop double-tap zoom and rubber-band scrolling. */
      html, body, #root { height: 100%; height: 100dvh; width: 100%; max-width: 100vw; }
      html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; background: #FFFFFF; }
      #root { display: flex; flex: 1; }
      /* Logo shown while the app code downloads; hides itself once the app renders into #root. */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; z-index: -1; }
      #boot img { border-radius: 22px; }
      #root:not(:empty) ~ #boot { display: none; }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><img src="/icon-192.png" alt="" width="96" height="96" /></div>
  </body>
</html>
