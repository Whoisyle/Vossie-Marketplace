<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Vossie Marketplace</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vossie" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style id="expo-reset">
      /* Phone browsers: use the visible height (dvh) so the bottom bar is not hidden under the
         browser toolbar; stop double-tap zoom and rubber-band scrolling. */
      html, body, #root { height: 100%; height: 100dvh; width: 100%; max-width: 100vw; }
      /* Pin the page to the screen so it never drags sideways, bounces or zooms; only the
         scrolling lists inside the app move. */
      html { -webkit-text-size-adjust: 100%; touch-action: manipulation; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; }
      body { position: fixed; inset: 0; width: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #FFFFFF; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      #root { display: flex; flex: 1; overflow: hidden; }
      /* Logo shown while the app code downloads; hides itself once the app renders into #root. */
      /* Installed app (Home Screen): the page draws behind the phone's status bar. A soft dark
         fade under the clock and battery keeps them readable on white screens. */
      @media all and (display-mode: standalone) {
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
          background: linear-gradient(rgba(53, 80, 92, 0.55), rgba(53, 80, 92, 0)); pointer-events: none; z-index: 2147483647; }
      }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; z-index: -1; }
      #boot img { border-radius: 22px; }
      #root:not(:empty) ~ #boot { display: none; }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><img src="/icon-192.png" alt="" width="96" height="96" /></div>
    <script>
      // iOS ignores user-scalable=no for pinch and double-tap; cancel those gestures.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); });
      });
    </script>
  </body>
</html>
