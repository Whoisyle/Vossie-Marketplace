<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Vossie film</title>
<style>
:root{--navy:#29475B;--teal:#376371;--sky:#DFEAF1;--mist:#b7c4cc;--ivory:#F5EFE6;--a:#050b10;--b:#0e2230;--glow:#376371}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ivory)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#05090c}
#bg{position:absolute;inset:0;background:radial-gradient(1500px 950px at var(--gx,62%) var(--gy,45%),var(--b),var(--a) 72%)}
#bg2{position:absolute;inset:0;background:radial-gradient(800px 560px at var(--hx,22%) var(--hy,100%),color-mix(in srgb,var(--glow) 55%,transparent),transparent 70%);opacity:.65}
#dots{position:absolute;inset:0}#dots i{position:absolute;border-radius:50%;background:var(--sky)}
#gl{position:absolute;inset:0}
#gl canvas{width:1920px!important;height:1080px!important}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55));pointer-events:none}
#grain{position:absolute;inset:-50px;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#titles{position:absolute;inset:0;pointer-events:none}
.title{position:absolute;overflow:hidden;line-height:1.08;padding:0 0 .12em}
.title span{display:block;transform:translateY(118%);font-weight:700;letter-spacing:-2px;color:var(--ivory);text-shadow:0 6px 40px rgba(0,0,0,.45)}
.title.big span{font-size:112px}.title.mid span{font-size:84px}.title.sm span{font-size:56px;letter-spacing:-1px}
.sub{position:absolute;font-size:34px;line-height:1.35;color:var(--mist);opacity:0;max-width:760px}
.pill{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 18px;border-radius:40px;background:rgba(223,234,241,.1);border:1px solid rgba(223,234,241,.28);backdrop-filter:blur(6px);font-size:26px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:0}
.pill i{width:16px;height:16px;border-radius:50%;background:var(--sky);box-shadow:0 0 18px var(--sky)}
#wm{position:absolute;left:50%;top:50%;width:1100px;margin-left:-550px;margin-top:-190px;opacity:0;transform-origin:50% 50%}
#wm img{width:100%;display:block;filter:brightness(0) invert(.95)}
#wm i{position:absolute;left:70.72%;top:4.2%;width:6.34%;aspect-ratio:1.05;border-radius:50%;background:var(--sky);box-shadow:0 0 60px rgba(223,234,241,.7)}
#bd{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--sky);box-shadow:0 0 90px rgba(223,234,241,.7);left:922px;top:502px;opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none}
.flare{position:absolute;width:1100px;height:6px;margin:-3px 0 0 -550px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(1.5px);opacity:0}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="bg2"></div><div id="dots"></div>
  <div id="gl"></div>
  <div id="fx"></div>
  <div id="wm"><img src="wordmark-nodot.svg"><i id="wmdot"></i></div>
  <div id="bd"></div>
  <div id="titles"></div>
  <div id="vig"></div><div id="grain"></div><div id="fade"></div>
</div>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module" src="engine.js"></script>
</body></html>
