<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vossie Pitch</title>
<style>
:root{--navy:#29475B;--ink:#1f2f39;--teal:#376371;--sky:#DFEAF1;--mist:#b7c4cc;--ivory:#F5EFE6;--white:#fff;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05090c;overflow:hidden;font-family:"DejaVu Sans",system-ui,Segoe UI,sans-serif;color:var(--ivory)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#0a1319;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.scene.on{opacity:1;pointer-events:auto}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dot{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--sky);box-shadow:0 0 60px rgba(223,234,241,.35)}
.h1{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1.05}
.h2{font-size:64px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.sub{font-size:34px;color:var(--mist);line-height:1.4;max-width:1300px}
.tag{font-size:22px;letter-spacing:6px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:28px}
.fade{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.on .fade.show,.fade.show{opacity:1;transform:none}
/* ---------- Act I ---------- */
#act1{background:#05090c}
#wm{position:absolute;left:50%;top:50%;width:1100px;margin-left:-550px;margin-top:-190px;opacity:0;transition:opacity .8s}
#wm img{width:100%;display:block;filter:brightness(0) invert(.93) sepia(.1)}
#wm .d{position:absolute;left:70.72%;top:4.2%;width:6.34%;aspect-ratio:1.05;background:var(--sky);border-radius:50%}
#wm .d.drop{animation:drop 1.4s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes drop{from{transform:translateY(-900px)}60%{transform:translateY(0)}72%{transform:translateY(-70px)}84%{transform:translateY(0)}92%{transform:translateY(-14px)}to{transform:translateY(0)}}
.world{position:absolute;inset:0;perspective:1400px}
.plane{position:absolute;left:50%;top:50%;width:1500px;height:900px;margin:-450px 0 0 -750px;transform:rotateX(55deg) rotateZ(-20deg) scale(.9);transform-style:preserve-3d;background:
 linear-gradient(rgba(223,234,241,.07) 1px,transparent 1px) 0 0/90px 90px,linear-gradient(90deg,rgba(223,234,241,.07) 1px,transparent 1px) 0 0/90px 90px,#0e1b24;border:1px solid rgba(223,234,241,.15);border-radius:20px;transition:transform 6s var(--ease)}
.plane.flat{transform:rotateX(0) rotateZ(0) scale(.95)}
.bld{position:absolute;background:#17303f;border:1px solid rgba(183,196,204,.25);border-radius:8px}
.node{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--sky);transform:translate(-50%,-50%);animation:pulse 2.4s ease-in-out infinite}
.node.warm{background:#e8b98a}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.5);opacity:.7}}
.bubble{position:absolute;padding:14px 22px;border-radius:22px;background:rgba(245,239,230,.9);color:var(--ink);font-size:24px;opacity:0;animation:pop .6s forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.four{display:flex;gap:90px}
.four div{display:flex;flex-direction:column;align-items:center;gap:20px;font-size:40px;font-weight:700;letter-spacing:6px;opacity:0;transform:scale(.3);transition:all .7s var(--ease)}
.four div i{width:70px;height:70px;border-radius:50%;background:var(--sky)}
.four.show div{opacity:1;transform:none}
.four.show div:nth-child(2){transition-delay:.15s}.four.show div:nth-child(3){transition-delay:.3s}.four.show div:nth-child(4){transition-delay:.45s}
.sys{position:relative;width:1100px;height:520px}
.sys span{position:absolute;padding:16px 30px;border-radius:40px;background:var(--navy);border:2px solid var(--teal);font-size:30px;font-weight:700;opacity:0;transform:scale(.6);transition:all .6s var(--ease)}
.sys.show span{opacity:1;transform:none}
.sys svg{position:absolute;inset:0;width:100%;height:100%}
.sys line{stroke:var(--teal);stroke-width:3;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.6s .6s}
.sys.show line{stroke-dashoffset:0}
.comps{position:relative;width:1300px;height:620px}
.comp{position:absolute;border:2px dashed var(--mist);border-radius:6px;transition:all 1.4s var(--ease);background:transparent}
.comps.done .comp{border:2px solid var(--teal);border-radius:20px;background:var(--navy)}
.cards{position:relative;width:1500px;height:560px}
.rc{position:absolute;padding:20px 28px;border-radius:14px;background:rgba(223,234,241,.08);border:1px solid rgba(223,234,241,.25);font-size:28px;transition:all 1.2s var(--ease)}
.arch .rc{background:var(--teal);border-color:var(--sky)}
.atlas{position:relative;width:1200px;height:700px}
.atlas .c{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:var(--sky);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:34px;box-shadow:0 0 90px rgba(223,234,241,.5)}
.atlas .a{position:absolute;left:50%;top:50%;padding:12px 24px;border-radius:30px;background:var(--navy);border:2px solid var(--teal);font-size:26px;font-weight:700;transform:translate(-50%,-50%);transition:transform 1s var(--ease)}
.atlas .a.red{background:#b4544a;border-color:#f3e0dc}
.atlas .a.green{background:#2F8A57;border-color:#E6F4EC}
.lanes{width:1400px}
.lane{display:flex;align-items:center;gap:20px;margin:16px 0;font-size:26px}
.lane b{width:230px;text-align:right;color:var(--mist);font-weight:400}
.lane i{height:34px;border-radius:17px;background:var(--teal);width:0;transition:width 1.6s var(--ease)}
.lanes.go .lane i{width:var(--w)}
.pms{display:flex;gap:70px;align-items:flex-end;height:360px}
.pms div{width:150px;background:var(--teal);border-radius:14px 14px 0 0;height:0;transition:height 1.4s var(--ease);display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:24px;font-weight:700}
.pms.go div{height:var(--h)}
.phone{position:relative;width:393px;height:852px;border-radius:64px;background:#000;padding:14px;box-shadow:0 0 0 3px #26323b,0 40px 120px rgba(0,0,0,.6),0 0 140px rgba(55,99,113,.35)}
.phone .scr{width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff;position:relative}
.phone iframe,.phone img.fb{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;object-fit:cover}
.phone img.fb{display:none}
.phone.fallback img.fb{display:block}
.phone.fallback iframe{display:none}
#credit{position:absolute;bottom:130px;font-size:60px;font-weight:700}
/* ---------- Act II ---------- */
#act2{background:radial-gradient(1200px 800px at 75% 40%,#16303d,#0a1319)}
.d-wrap{display:flex;height:100%;padding:80px 120px;gap:120px;align-items:center}
.d-left{flex:1}
.d-left .id{font-size:24px;letter-spacing:6px;color:var(--teal);font-weight:700}
.d-left h2{font-size:92px;line-height:1.02;margin:20px 0 30px;font-weight:700;letter-spacing:-2px}
.d-left p.claim{font-size:36px;color:var(--sky);line-height:1.35;margin-bottom:46px;max-width:900px}
.d-left ul{list-style:none;font-size:30px;line-height:1.9;color:var(--mist)}
.d-left li::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sky);margin-right:22px}
.d-right{flex:0 0 auto;transform:scale(1);transform-origin:center}
.cue-key{position:absolute;left:120px;bottom:60px;font-size:22px;color:var(--teal);letter-spacing:3px}
/* hud */
#hud{position:fixed;left:14px;bottom:12px;font:12px/1.5 system-ui;color:#6c8190;z-index:9;display:flex;gap:16px;align-items:center;background:rgba(5,9,12,.7);padding:6px 12px;border-radius:20px}
#hud b{color:#cfe0ea}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--sky);width:0;z-index:9;transition:width .4s}
#help{position:fixed;right:14px;bottom:12px;font:12px system-ui;color:#6c8190;z-index:9;background:rgba(5,9,12,.7);padding:6px 12px;border-radius:20px}
/* finale */
.orbit{position:relative;width:1100px;height:800px}
.orbit .core{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center}
.orbit .core img{width:170px}
.orbit .n{position:absolute;left:50%;top:50%;width:230px;margin:-40px -115px;padding:22px 10px;border-radius:50px;background:var(--navy);border:2px solid var(--teal);font-size:26px;font-weight:700;text-align:center;opacity:0;transition:opacity .6s,transform 1.4s var(--ease),background .5s}
.orbit.show .n{opacity:1}
.orbit .n.lit{background:var(--teal)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage">

<!-- ================= ACT I ================= -->
<section class="scene" id="act1">
  <div id="a1" style="position:absolute;inset:0"></div>
</section>

<!-- ================= ACT II ================= -->
<section class="scene" id="act2">
  <div class="d-wrap">
    <div class="d-left">
      <div class="id" id="d-id"></div>
      <h2 id="d-title"></h2>
      <p class="claim" id="d-claim"></p>
      <ul id="d-points"></ul>
    </div>
    <div class="d-right">
      <div class="phone" id="phone"><div class="scr">
        <iframe id="app" title="Vossie app" allow="clipboard-write"></iframe>
        <img class="fb" id="fb" alt="">
      </div></div>
    </div>
  </div>
  <div class="cue-key" id="d-cue"></div>
</section>

<!-- ================= FINALE ================= -->
<section class="scene center" id="finale" style="background:#05090c">
  <div class="orbit" id="orbit">
    <div class="core"><img src="dot.svg" alt=""></div>
  </div>
  <div id="fwm" class="fade" style="position:absolute;bottom:90px;width:100%;text-align:center">
    <div class="h2">Good things. Brighter campus.</div>
  </div>
</section>
</div>

<div id="hud"><span><b id="h-cue">INTRO</b></span><span id="h-time"></span><span id="h-mode"></span></div>
<div id="help">Space / → next · ← back · A Act I · 1–9 chapters · F fallback · R reset · Esc fullscreen</div>

<script>
const APP_URL = new URLSearchParams(location.search).get('app') || 'http://localhost:8091/';
const $ = s => document.querySelector(s);
const stage = $('#stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const wait = ms => new Promise(r=>setTimeout(r,ms));
let token = 0; // cancels running timelines

/* ---------------- Act I shots (A01-A20, condensed) ---------------- */
const A = $('#a1');
const WM = `<div id="wm"><img src="wordmark-nodot.svg" alt="Vossie"><div class="d" id="wmd"></div></div>`;
const campusPlane = (extra='') => `<div class="world"><div class="plane" id="plane">
  <div class="bld" style="left:120px;top:140px;width:220px;height:160px"></div>
  <div class="bld" style="left:520px;top:80px;width:300px;height:200px"></div>
  <div class="bld" style="left:980px;top:200px;width:260px;height:180px"></div>
  <div class="bld" style="left:260px;top:520px;width:340px;height:200px"></div>
  <div class="bld" style="left:860px;top:560px;width:240px;height:170px"></div>${extra}</div></div>`;
const nodes = (n,warm) => Array.from({length:n},(_,i)=>`<div class="node ${i%warm==0?'warm':''}" style="left:${80+(i*137)%1340}px;top:${60+(i*211)%780}px;animation-delay:${(i%7)*.3}s"></div>`).join('');

const shots = [
 {id:'A01–A03',label:'Identity',t:20,run:async k=>{
   A.innerHTML=WM;const wm=$('#wm'),d=$('#wmd');d.style.visibility='hidden';
   const dot=document.createElement('div');dot.className='dot';dot.style.cssText='left:928px;top:508px;opacity:0;transition:all .8s';A.appendChild(dot);
   await wait(1400);if(k!==token)return;dot.style.opacity=1;dot.style.transform='scale(.8)';await wait(900);
   dot.style.transition='all .55s cubic-bezier(.3,.9,.4,1)';dot.style.transform='translateY(-220px)';await wait(550);
   dot.style.transition='all .5s cubic-bezier(.5,0,.9,.4)';dot.style.transform='translateY(0)';await wait(500);
   dot.style.transition='all .8s cubic-bezier(.3,.9,.4,1)';dot.style.transform='translateY(-420px)';await wait(800);
   if(k!==token)return;dot.remove();wm.style.opacity=1;d.style.visibility='visible';d.classList.add('drop');await wait(2400);
   A.insertAdjacentHTML('beforeend',`<div class="center" style="position:absolute;left:0;right:0;top:760px"><div class="sub fade" id="m">MARKETPLACE</div></div>`);
   await wait(50);$('#m').classList.add('show');$('#m').style.letterSpacing='18px';await wait(2400);
 }},
 {id:'A04',label:'Campus',t:12,run:async k=>{
   A.innerHTML=campusPlane(nodes(26,6))+`<div class="center" style="position:absolute;left:0;right:0;bottom:90px"><div class="sub fade" id="m">Your campus already contains an economy.</div></div>`;
   await wait(60);$('#plane').classList.add('flat');$('#m').classList.add('show');await wait(6000);$('#plane').classList.remove('flat');await wait(5000);
 }},
 {id:'A05',label:'Needs & supply',t:20,run:async k=>{
   const pairs=[['Need a textbook','Unused book'],['Hungry','Cooking for a side hustle'],['Need a logo','Designer with time'],['Parcel to send','Passing student']];
   A.innerHTML=campusPlane()+`<div id="bb"></div>`;
   for(const [a,b] of pairs){ if(k!==token)return;
     const x=240+Math.random()*900,y=180+Math.random()*500;
     $('#bb').insertAdjacentHTML('beforeend',`<div class="bubble" style="left:${x}px;top:${y}px">${a}</div><div class="bubble" style="left:${x+420}px;top:${y+110}px;background:#e8b98a;animation-delay:.5s">${b}</div>`);
     await wait(4800);}
 }},
 {id:'A06–A07',label:'Fragmentation → clarity',t:22,run:async k=>{
   const msgs=['DM me','who has a calculator??','pay cash','WhatsApp group #14','is this still available?','posted on 3 pages','lost in the chat','???','selling cheap!!','where do I collect'];
   A.innerHTML=`<div id="noise"></div>`;
   for(let i=0;i<msgs.length*2;i++){ if(k!==token)return;
     $('#noise').insertAdjacentHTML('beforeend',`<div class="bubble" style="left:${Math.random()*1500}px;top:${Math.random()*900}px;font-size:${22+Math.random()*16}px;transform:rotate(${Math.random()*14-7}deg)">${msgs[i%msgs.length]}</div>`);
     await wait(520);}
   A.innerHTML=`<div class="center" style="position:absolute;inset:0"><div class="four" id="four"><div><i></i>BUY</div><div><i></i>SELL</div><div><i></i>MOVE</div><div><i></i>GROW</div></div></div>`;
   await wait(100);$('#four').classList.add('show');await wait(6000);
 }},
 {id:'A08–A09',label:'Malindi · Product',t:20,run:async k=>{
   A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:50px"><div class="tag">Product Lead</div><div class="h2">Malindi Mpumelelo</div>
   <div class="sys" id="sys"><svg><line x1="200" y1="220" x2="550" y2="220"/><line x1="550" y1="220" x2="900" y2="220"/><line x1="550" y1="220" x2="550" y2="420"/></svg>
   <span style="left:80px;top:190px">Buyer</span><span style="left:430px;top:190px;background:var(--teal)">Marketplace</span><span style="left:800px;top:190px">Seller</span><span style="left:470px;top:395px">Courier</span><span style="left:20px;top:30px;background:transparent">Campus</span><span style="left:430px;top:30px;background:transparent">Operations</span><span style="left:830px;top:30px;background:transparent">Incubation</span></div></div>`;
   await wait(200);$('#sys').classList.add('show');await wait(9000);
 }},
 {id:'A10–A11',label:'Oratile · Design',t:22,run:async k=>{
   const c=(l,t,w,h,r)=>`<div class="comp" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px" data-r="${r}"></div>`;
   A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:30px"><div class="tag">UI / UX Designer</div><div class="h2">Oratile Modise</div>
   <div class="comps" id="comps">${c(40,30,260,140)+c(340,30,620,60)+c(1000,30,260,140)+c(40,230,380,380)+c(470,140,400,200)+c(900,230,360,380)+c(470,380,400,230)}</div></div>`;
   await wait(4500);$('#comps').classList.add('done');await wait(5000);
   A.innerHTML=`<div class="center" style="position:absolute;inset:0"><div class="phone" style="transform:rotateY(-24deg) rotateX(6deg) scale(.85);transition:transform 4s var(--ease)" id="ph3"><div class="scr"><img class="fb" style="display:block" src="fb/05-home-all.png"></div></div></div>`;
   await wait(100);$('#ph3').style.transform='rotateY(-8deg) rotateX(2deg) scale(.9)';await wait(5500);
 }},
 {id:'A12–A13',label:'Babalo · Research → architecture',t:42,run:async k=>{
   const items=[['Behaviour',60,40],['Identity',420,10],['Logistics',780,60],['Payments',1140,20],['Security',240,200],['Feasibility',660,230]];
   const arch=[['Auth',60,40],['Database',420,10],['Maps',780,60],['Payments',1140,20],['Frontend',240,200],['Integrations',660,230]];
   A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:34px"><div class="tag">Developer &amp; Research Lead</div><div class="h2">Babalo Kali</div>
   <div class="cards" id="cards">${items.map(([t,l,tp])=>`<div class="rc" style="left:${l}px;top:${tp+30}px">${t}</div>`).join('')}</div></div>`;
   await wait(4500);
   const rcs=[...document.querySelectorAll('.rc')];$('#cards').classList.add('arch');
   rcs.forEach((r,i)=>{r.textContent=arch[i][0];r.style.left=(100+i*220)+'px';r.style.top=(220+(i%2)*80)+'px'});
   await wait(16000);
 }},
 {id:'A14–A16',label:'Agentic engineering',t:36,run:async k=>{
   const ag=['Pixel','Forge','Schema','Market','Relay','Bridge','Kinetic'];
   A.innerHTML=`<div class="center" style="position:absolute;inset:0"><div class="atlas" id="atlas"><div class="c">Atlas</div>${ag.map(a=>`<div class="a">${a}</div>`).join('')}</div></div>
   <div class="center" style="position:absolute;left:0;right:0;bottom:60px"><div class="sub" id="cap">Atlas dispatches a team of specialist agents.</div></div>`;
   const els=[...document.querySelectorAll('.a')];
   await wait(300);els.forEach((e,i)=>{const a=i/7*Math.PI*2-Math.PI/2;e.style.transform=`translate(calc(-50% + ${Math.cos(a)*470}px),calc(-50% + ${Math.sin(a)*270}px))`});
   await wait(7000);if(k!==token)return;
   els[3].classList.add('red');$('#cap').textContent='A build fails. Medic isolates it.';await wait(4500);
   els[3].classList.remove('red');els[3].classList.add('green');$('#cap').textContent='Repaired. Guardian checks the surrounding workflow.';await wait(5000);
   $('#cap').textContent='Commit → pull request → Sentinel verifies independently.';
   els.forEach(e=>{e.classList.remove('red');e.classList.add('green')});await wait(9000);
 }},
 {id:'A17–A18',label:'Danny · Coordination + business',t:30,run:async k=>{
   A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:34px"><div class="tag">Project Manager</div><div class="h2">Danny Mohale</div>
   <div class="lanes" id="lanes">${[['Product','80%'],['Design','65%'],['Research','90%'],['Development','75%'],['Testing','55%'],['Marketing','45%']].map(([n,w])=>`<div class="lane"><b>${n}</b><i style="--w:${w}"></i></div>`).join('')}</div></div>`;
   await wait(300);$('#lanes').classList.add('go');await wait(8000);
   A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:34px"><div class="tag">Business Analysis · Marketing</div><div class="h2">Babalo Kali &amp; Danny Mohale</div>
   <div class="pms" id="pms">${[['Demand',300],['Supply',220],['Logistics',260],['Sellers',330]].map(([n,h])=>`<div style="--h:${h}px">${n}</div>`).join('')}</div>
   <div class="sub">Demand, supply and seller growth become launch positioning.</div></div>`;
   await wait(300);$('#pms').classList.add('go');await wait(11000);
 }},
 {id:'A19–A20',label:'Handoff to Danny',t:16,run:async k=>{
   A.innerHTML=`<div id="end" class="center" style="position:absolute;inset:0"><div class="h1 fade" id="e1">VOSSIE LIVE</div></div>`;
   await wait(200);$('#e1').classList.add('show');await wait(3500);
   A.innerHTML=`<div class="center" style="position:absolute;inset:0"><div class="tag">Pitch Lead</div><div class="h1 fade" id="e2">Danny Mohale</div></div>`;
   await wait(100);$('#e2').classList.add('show');await wait(5000);
 }},
];
const totalAct1 = shots.reduce((a,s)=>a+s.t,0);

/* ---------------- Act II chapters ---------------- */
const chapters = [
 {cue:'REVEAL',n:'D01',t:60,title:'What Vossie is',claim:'One verified campus identity, many ways to take part.',pts:['Sign in with a student identity','Buyer, Seller and Courier modes','Start from the real app'],fb:'fb/05-home-all.png',path:'/'},
 {cue:'BUYER',n:'D02',t:120,title:'Buyer discovery',claim:'Campus-scoped discovery, not generic classifieds.',pts:['Home and categories','Search and filters','Seller profiles'],fb:'fb/05-home-all.png',path:'/home'},
 {cue:'REELS',n:'D03',t:90,title:'Marketplace Reels',claim:'Content, discovery and commerce in one place.',pts:['Swipe vertical Reels','Tagged product lifts out of the video','Tap through to the listing'],fb:'fb/18-reels.png',path:'/reels'},

/* ---------------- Cue controller ---------------- */
const order = [{type:'intro'},{type:'act1'},...chapters.map((c,i)=>({type:'chap',i})),{type:'finale'}];
let pos = 0, fbMode=false, cueStart=Date.now();
const scenes = ['act1','act2','finale'];
function show(id){scenes.forEach(s=>$('#'+s).classList.toggle('on',s===id))}
function setHud(cue,mode){$('#h-cue').textContent=cue;$('#h-mode').textContent=mode||'';cueStart=Date.now();
  $('#bar').style.width=(pos/(order.length-1)*100)+'%'}
setInterval(()=>{const s=Math.floor((Date.now()-cueStart)/1000);$('#h-time').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);

function intro(){token++;show('act1');
  A.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:30px"><div class="tag">EduHackers 2.0 · Hack Jam 2026</div><div class="h1">Vossie</div><div class="sub">Press Space to start the film</div></div>`;setHud('INTRO');}
async function playAct1(){const k=++token;show('act1');setHud('ACT I','~4 min film');
  let elapsed=0;
  for(const s of shots){ if(k!==token)return; $('#h-cue').textContent='ACT I · '+s.label;
    await s.run(k); elapsed+=s.t; $('#bar').style.width=(elapsed/totalAct1*100)/ (order.length-1)*1+'%'; }
  if(k===token){pos=2;gotoPos(2)}
}
async function showChapter(i){token++;const c=chapters[i];show('act2');
  $('#d-id').textContent=`${c.n} · ${Math.round(c.t/60*10)/10} min`;$('#d-title').textContent=c.title;$('#d-claim').textContent=c.claim;
  $('#d-points').innerHTML=c.pts.map(p=>`<li>${p}</li>`).join('');$('#d-cue').textContent=`CUE · ${c.cue}`;
  $('#fb').src=c.fb;
  const app=$('#app');
  if(!app.dataset.loaded){app.src=APP_URL;app.dataset.loaded='1'}
  setHud(c.cue,fbMode?'FALLBACK':'LIVE');
}
async function showFinale(){const k=++token;show('finale');setHud('FINALE');
  const o=$('#orbit');[...o.querySelectorAll('.n')].forEach(n=>n.remove());o.classList.remove('show');$('#fwm').classList.remove('show');
  const caps=['Requests','Reels','Student couriers','Cross-campus hubs','Incubation','Operations'];
  caps.forEach((c,i)=>{const a=i/6*Math.PI*2-Math.PI/2;const n=document.createElement('div');n.className='n';n.textContent=c;
    n.style.transform=`translate(${Math.cos(a)*420}px,${Math.sin(a)*300}px)`;o.appendChild(n)});
  await wait(100);o.classList.add('show');
  const ns=[...o.querySelectorAll('.n')];
  for(const n of ns){await wait(1600);if(k!==token)return;n.classList.add('lit')}
  await wait(1200);$('#fwm').classList.add('show');
}
function gotoPos(p){pos=Math.max(0,Math.min(order.length-1,p));const s=order[pos];
  if(s.type==='intro')intro();else if(s.type==='act1')playAct1();
  else if(s.type==='chap')showChapter(s.i);else showFinale();}
function toggleFallback(){fbMode=!fbMode;$('#phone').classList.toggle('fallback',fbMode);$('#h-mode').textContent=fbMode?'FALLBACK':'LIVE'}
function reset(){const app=$('#app');app.src=APP_URL;try{localStorage.clear()}catch(e){}}

addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();gotoPos(pos+1)}
  else if(e.key==='ArrowLeft'){gotoPos(pos-1)}
  else if(e.key==='a'||e.key==='A'){pos=1;gotoPos(1)}
  else if(/^[1-9]$/.test(e.key)){pos=2+Number(e.key)-1;gotoPos(pos)}
  else if(e.key==='0'){gotoPos(order.length-1)}
  else if(e.key==='f'||e.key==='F'){toggleFallback()}
  else if(e.key==='r'||e.key==='R'){reset()}
  else if(e.key==='Escape'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
window.__pitch={gotoPos,order,chapters,shots};
gotoPos(0);
</script>
