<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vossie Walkthrough</title>
<style>
:root{--navy:#29475B;--teal:#376371;--sky:#DFEAF1;--mist:#b7c4cc;--ivory:#F5EFE6;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"DejaVu Sans","Segoe UI",system-ui,sans-serif;color:var(--ivory)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#05090c;overflow:hidden}
#glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 70% 50%,rgba(55,99,113,.45),transparent 70%),radial-gradient(700px 500px at 15% 90%,rgba(41,71,91,.35),transparent 70%);transition:background-position 2s}
#rig{position:absolute;left:1180px;top:100px;width:421px;height:880px;perspective:2200px}
#phone{position:absolute;inset:0;border-radius:68px;background:#0b0f12;padding:14px;transform-style:preserve-3d;transform:translateX(900px) rotateY(-35deg);opacity:0;transition:transform 1.8s var(--ease),opacity 1.2s;box-shadow:0 0 0 3px #2a3943,0 0 0 5px #0b0f12,0 60px 140px rgba(0,0,0,.7),0 0 160px rgba(55,99,113,.35)}
#phone .scr{width:393px;height:852px;border-radius:54px;overflow:hidden;background:#fff;position:relative}
#phone iframe{width:393px;height:852px;border:0;display:block}
#phone .notch{position:absolute;left:50%;top:10px;width:118px;height:32px;margin-left:-59px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
#ref{position:absolute;left:1180px;top:970px;width:421px;height:200px;transform:scaleY(-1);opacity:0}
#txt{position:absolute;left:150px;top:0;width:960px;height:1080px;display:flex;flex-direction:column;justify-content:center}
#txt .k{font-size:24px;letter-spacing:8px;text-transform:uppercase;color:#6fa0b2;font-weight:700;margin-bottom:34px;opacity:0;transform:translateY(20px);transition:all .9s var(--ease)}
#txt .h{white-space:pre-line;font-size:132px;line-height:1;font-weight:700;letter-spacing:-5px;background:linear-gradient(180deg,#fff 20%,#9db9c6);-webkit-background-clip:text;color:transparent;opacity:0;transform:translateY(40px);filter:blur(14px);transition:all 1.1s var(--ease)}
#txt .s{font-size:38px;line-height:1.35;color:var(--mist);margin-top:38px;max-width:820px;opacity:0;transform:translateY(24px);transition:all 1s .15s var(--ease)}
#txt.in .k,#txt.in .h,#txt.in .s{opacity:1;transform:none;filter:none}
#full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#05090c;opacity:0;pointer-events:none;transition:opacity 1s;z-index:20}
#full.on{opacity:1}
#full .big{font-size:150px;font-weight:700;letter-spacing:-6px;line-height:1;background:linear-gradient(180deg,#fff 30%,#8fb0bf);-webkit-background-clip:text;color:transparent}
#full .sm{font-size:40px;color:var(--mist);margin-top:34px}
#full .wm{width:980px;position:relative}
#full .wm img{width:100%;display:block;filter:brightness(0) invert(.95)}
#full .wm i{position:absolute;left:70.72%;top:4.2%;width:6.34%;aspect-ratio:1.05;border-radius:50%;background:var(--sky);box-shadow:0 0 50px rgba(223,234,241,.6)}
#bigdot{position:absolute;width:70px;height:70px;border-radius:50%;background:var(--sky);box-shadow:0 0 90px rgba(223,234,241,.6);left:925px;top:505px;opacity:0;z-index:30}
.chips{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:1500px;margin-top:60px}
.chips span{padding:18px 34px;border-radius:50px;border:2px solid var(--teal);background:rgba(41,71,91,.55);font-size:32px;font-weight:700;opacity:0;transform:scale(.6);transition:all .7s var(--ease)}
.chips span.on{opacity:1;transform:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .6s}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="txt"><div class="k" id="k"></div><div class="h" id="h"></div><div class="s" id="s"></div></div>
  <div id="rig"><div id="phone"><div class="notch"></div><div class="scr"><iframe id="app" title="Vossie"></iframe></div></div></div>
  <div id="full"></div>
  <div id="bigdot"></div>
  <div id="fade"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const st = $('#stage');
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); st.style.transform = `scale(${s})`; st.style.left=(innerWidth-1920*s)/2+'px'; st.style.top=(innerHeight-1080*s)/2+'px'; }
addEventListener('resize', fit); fit();
$('#app').src = q.get('app') || 'http://localhost:8092/';

window.cap = (k,h,s) => new Promise(res => {
  const t = $('#txt'); t.classList.remove('in');
  setTimeout(() => { $('#k').textContent=k||''; $('#h').textContent=(h||'').split('|').join(String.fromCharCode(10)); $('#s').textContent=s||''; void t.offsetWidth; t.classList.add('in'); res(); }, 450);
});
window.hideCap = () => $('#txt').classList.remove('in');
window.phone = (o={}) => { const p=$('#phone'); const {x=0,y=0,ry=-9,rx=3,s=1,op=1,ms=1800}=o;
  p.style.transition=`transform ${ms}ms cubic-bezier(.22,.8,.2,1),opacity 1.2s`; p.style.opacity=op;
  p.style.transform=`translate(${x}px,${y}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${s*1.1})`; };
window.full = (html) => { const f=$('#full'); if(html==null){f.classList.remove('on');return;} f.innerHTML=html; void f.offsetWidth; f.classList.add('on'); };
window.chips = (i) => document.querySelectorAll('.chips span')[i]?.classList.add('on');
window.fadeBlack = (on) => $('#fade').style.opacity = on?1:0;
window.dotTo = (x,y,op=1,ms=600,sc=1) => { const d=$('#bigdot'); d.style.transition=`all ${ms}ms cubic-bezier(.3,.9,.4,1)`; d.style.left=x+'px'; d.style.top=y+'px'; d.style.opacity=op; d.style.transform=`scale(${sc})`; };
window.__ready = true;
</script>
</body>
</html>
